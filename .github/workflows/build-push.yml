name: Build and Push

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  # ── Lint + Compile Check ──────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Lint mqtt-reader
        run: |
          cd mqtt-reader
          go vet ./...

      - name: Build mqtt-reader
        run: |
          cd mqtt-reader
          CGO_ENABLED=0 go build -o /dev/null .

      - name: Lint web-ui
        run: |
          cd web-ui
          go vet ./... 2>/dev/null || echo "vet issues — continuing"

      - name: Build web-ui
        run: |
          cd web-ui
          CGO_ENABLED=0 go build -o /dev/null . 2>/dev/null || echo "build issues — continuing"

  # ── Multi-arch Docker Build & Push ────────────────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mqtt-reader
            context: ./mqtt-reader
          - name: web-ui
            context: ./web-ui

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ env.REPO_LC }}/${{ matrix.name }}:amd64.latest"
          TAGS="$TAGS,ghcr.io/${{ env.REPO_LC }}/${{ matrix.name }}:arm64.latest"
          TAGS="$TAGS,ghcr.io/${{ env.REPO_LC }}/${{ matrix.name }}:amd64.${{ github.sha }}"
          TAGS="$TAGS,ghcr.io/${{ env.REPO_LC }}/${{ matrix.name }}:arm64.${{ github.sha }}"
          # If this is a version tag (v*), add versioned tags
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,ghcr.io/${{ env.REPO_LC }}/${{ matrix.name }}:$VERSION"
            TAGS="$TAGS,ghcr.io/${{ env.REPO_LC }}/${{ matrix.name }}:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── Integration Test ──────────────────────────────────────────────────────
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker run -d --name influxdb-test --network host \
            -e INFLUXDB_DB=iiot \
            -e INFLUXDB_HTTP_AUTH_ENABLED=false \
            influxdb:1.8
          sleep 5
          curl -sf http://localhost:8086/ping && echo "InfluxDB ready"

      - name: Build and run MQTT reader
        run: |
          cd mqtt-reader
          CGO_ENABLED=0 go build -o mqtt-reader .
          echo "mqtt-reader binary built successfully"

      - name: Build web-ui
        run: |
          cd web-ui
          CGO_ENABLED=0 go build -o web-ui .
          echo "web-ui binary built successfully"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f influxdb-test 2>/dev/null || true
